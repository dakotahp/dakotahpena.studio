{{ define "main" }}

<section class="content-column content-column--wide prose">
  {{ .Content }}
</section>

<section class="content-column content-column--wide prose">
  {{ range .Pages }}
    <article>
      <h1 class="post__title">
        <a href="{{ .RelPermalink }}" class="no-underline">
          {{ .Title }}<span class="post__title-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </h1>

      <div class="post__meta">
        <time datetime="{{ .Date }}">
          {{- .Date.Format (.Site.Params.dateFormat) -}}
        </time>
      </div>

      <p>
        {{ .Summary }}
      </p>

      {{ if .Truncated }}
        <div>
          <a href="{{ .RelPermalink }}">Read more…</a>
        </div>
      {{ end }}
    </article>
  {{ end }}
</section>

{{ end }}
