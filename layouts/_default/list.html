{{ define "main" }}

{{ partial "back-link.html" (dict "url" "/" "label" "Home" "wide" true) }}

<section class="content-column content-column--wide prose blog-index-container">
  {{ range .Paginator.Pages }}
    <article>
      <div class="post__meta">
        <time datetime="{{ .Date }}">{{ .Date.Format $.Site.Params.dateFormat }}</time>
      </div>
      <h2 class="post__title">
        <a href="{{ .RelPermalink }}" class="no-underline">
          {{ .Title }}<span class="post__title-arrow" aria-hidden="true">&rarr;</span>
        </a>
      </h2>
      <div>
        {{ .Summary }}
      </div>
      <a href="{{ .RelPermalink }}" class="read-more no-underline">
        Read more<span class="read-more__arrow" aria-hidden="true">&rarr;</span>
      </a>
    </article>
  {{ end }}
</section>

{{ end }}
