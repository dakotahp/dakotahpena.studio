name: Build
on: [push]
jobs:
  build:
    name: Build site and check internal links
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"

      - name: Build
        run: hugo --panicOnWarning --baseURL /

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/public public
